<section class="video-section" id="demo">

  <!-- Ambient background shapes -->
  <div class="vid-bg vid-bg-teal"></div>
  <div class="vid-bg vid-bg-yellow"></div>

  <div class="video-container">

    <div class="video-header">
      <div class="section-badge">{{ 'videoSection.badge' | translate }}</div>
      <h2 class="video-title">{{ 'videoSection.title' | translate }}</h2>
      <p class="video-subtitle">{{ 'videoSection.subtitle' | translate }}</p>
    </div>

    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/MmlNGWqN-0k?si=yfQ5bKJ-J6KGJsar"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

  </div>
</section>
